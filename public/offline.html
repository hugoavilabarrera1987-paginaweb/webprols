<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07182f">
    <title>Sin conexión | Web Pro LS</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f8fc; color: #101828; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
      main { width: min(100%, 480px); padding: 34px 28px; border: 1px solid #e1e8f1; border-radius: 18px; background: #fff; box-shadow: 0 20px 60px rgba(7, 24, 47, .1); text-align: center; }
      img { width: 64px; height: 64px; margin-bottom: 12px; border-radius: 15px; }
      h1 { margin: 0 0 12px; color: #07182f; font-size: clamp(24px, 6vw, 32px); }
      p { margin: 0 auto 20px; color: #526174; font-size: 15px; line-height: 1.65; }
      button { min-width: 44px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 9px; background: #1265df; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #37c6dc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" width="64" height="64" alt="">
      <h1>Estás sin conexión</h1>
      <p>La página solicitada necesita Internet. El contenido guardado puede no estar actualizado; el portafolio, el panel y los envíos requieren conexión.</p>
      <button type="button" onclick="window.location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
